<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 110" width="380" height="110" fill="none">
  <!-- Gear Lion Silhouette Group -->
  <g transform="translate(16, 12)">
    <!-- Gear Lion Body composed of mechanical gears and silhouette -->
    <!-- Hindquarters / Back Cog -->
    <circle cx="28" cy="46" r="18" fill="#1E293B" />
    <circle cx="28" cy="46" r="8" fill="#FFFFFF" />
    <circle cx="28" cy="46" r="3" fill="#1E293B" />
    <!-- Gear notches on hind cog -->
    <path d="M28 25 L28 29 M28 63 L28 67 M7 46 L11 46 M45 46 L49 46 M13 31 L16 34 M40 58 L43 61 M13 61 L16 58 M40 31 L43 34" stroke="#1E293B" stroke-width="3" stroke-linecap="round" />

    <!-- Center Torso / Engine Cog -->
    <circle cx="56" cy="40" r="22" fill="#0F172A" />
    <circle cx="56" cy="40" r="10" fill="#FFFFFF" />
    <circle cx="56" cy="40" r="4" fill="#0F172A" />
    <path d="M56 15 L56 20 M56 60 L56 65 M31 40 L36 40 M76 40 L81 40 M38 22 L42 26 M70 54 L74 58 M38 58 L42 54 M70 22 L74 26" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round" />

    <!-- Chest & Mane Cogs -->
    <circle cx="86" cy="34" r="17" fill="#1E293B" />
    <circle cx="86" cy="34" r="7" fill="#FFFFFF" />
    <circle cx="86" cy="34" r="2.5" fill="#1E293B" />

    <!-- Lion Head / Roaring Profile -->
    <path d="M96 26 C98 22, 104 20, 108 22 C112 24, 116 26, 118 29 C121 31, 120 34, 117 35 C113 36, 110 38, 112 41 C114 43, 110 45, 106 44 C102 43, 98 46, 95 44 Z" fill="#0F172A" />
    <!-- Lion Ear -->
    <path d="M102 19 C104 16, 108 17, 106 20 Z" fill="#0F172A" />

    <!-- Lion Front Legs (Stepping Forward) -->
    <path d="M78 48 L76 74 L84 74 L86 52 Z" fill="#0F172A" />
    <path d="M90 46 L94 74 L102 74 L98 48 Z" fill="#1E293B" />

    <!-- Lion Back Legs (Stance) -->
    <path d="M22 56 L18 74 L25 74 L29 58 Z" fill="#0F172A" />
    <path d="M36 58 L38 74 L45 74 L42 58 Z" fill="#1E293B" />

    <!-- Tail curving upwards -->
    <path d="M12 44 C8 32, 14 22, 16 16 C17 14, 19 16, 18 19 C16 23, 14 30, 18 38 Z" fill="#0F172A" />
    <!-- Tail Tuft -->
    <circle cx="16" cy="14" r="3.5" fill="#0F172A" />
  </g>

  <!-- Divider Line -->
  <line x1="148" y1="18" x2="148" y2="92" stroke="#CBD5E1" stroke-width="1.5" />

  <!-- Typography: MAKE IN INDIA -->
  <g transform="translate(162, 18)">
    <text x="0" y="27" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="27" font-weight="900" fill="#0F172A" letter-spacing="1">
      MAKE IN
    </text>
    <text x="0" y="52" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="27" font-weight="900" fill="#0F172A" letter-spacing="1">
      INDIA
    </text>
    
    <!-- Indian Tricolor Ribbon Underline -->
    <rect x="0" y="60" width="40" height="3.5" rx="1" fill="#FF9933" />
    <rect x="42" y="60" width="40" height="3.5" rx="1" fill="#0A3871" />
    <rect x="84" y="60" width="40" height="3.5" rx="1" fill="#138808" />

    <!-- Subtitle: National Manufacturing Initiative -->
    <text x="0" y="76" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" fill="#64748B" letter-spacing="0.6">
      A GOVT. OF INDIA INITIATIVE
    </text>
  </g>
</svg>
